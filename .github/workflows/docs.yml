name: CI Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for accurate page timestamps

      - uses: astral-sh/setup-uv@v6

      # velocirepo is a Go CLI (go_cli.enabled in great-docs.yml), so the docs
      # build compiles the binary and extracts its --help tree. Go must be on
      # PATH for the CLI reference to generate.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build docs
        # Pinned to a specific commit to prevent silent supply-chain updates.
        # To update: run `git ls-remote https://github.com/posit-dev/great-docs HEAD`
        # and replace the SHA below, then update this comment.
        run: uvx --from git+https://github.com/posit-dev/great-docs@61531325ab306e4d584920524514aa102e1d95c1 great-docs build

      - name: Save docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

      - name: Upload build timings
        uses: actions/upload-artifact@v7
        with:
          name: build-timings
          path: great-docs/_site/build-timings.json

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  preview-docs:
    name: "Preview Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.event_name == 'pull_request'
    permissions:
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      # Start deployment
      - name: Configure pull release name
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "RELEASE_NAME=pr-${{ github.event.number }}" >> $GITHUB_ENV

      - name: Configure branch release name
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          # use branch name, but replace slashes. E.g. feat/a -> feat-a
          echo "RELEASE_NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

      # Deploy
      - name: Create Github Deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: ${{ env.RELEASE_NAME }}
          ref: ${{ github.head_ref }}
          logs: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
